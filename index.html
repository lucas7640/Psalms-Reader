<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psalms · Ancient Voices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Noto+Serif+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   Psalms · Ancient Voices  —  Full Stylesheet
   ═══════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --parchment:   #faf3e0;
  --parchment-2: #f2e8c9;
  --parchment-3: #ece0b8;
  --leather:     #1e0c06;
  --leather-2:   #2e1508;
  --crimson:     #7a1f1f;
  --crimson-2:   #9b2b2b;
  --gold:        #c9952a;
  --gold-light:  #e0b84a;
  --gold-pale:   #f5e9be;
  --ink:         #1c0e04;
  --ink-mid:     #4a2d12;
  --ink-faint:   #8a6040;
  --divider:     #d4b896;
  --heb-tint:    #fdf0d8;
  --lat-tint:    #ecf2e8;
  --kjv-tint:    #f8f2e6;
  --esv-tint:    #e8eff8;
  --rsv-tint:    #f2eaf8;
  --shadow-sm:   0 2px 8px rgba(30,12,6,.12);
  --shadow-md:   0 6px 24px rgba(30,12,6,.16);
  --shadow-lg:   0 16px 48px rgba(30,12,6,.28);
  --radius:      10px;
  --serif:       "EB Garamond", Georgia, "Times New Roman", serif;
  --hebrew:      "Noto Serif Hebrew", "SBL Hebrew", "Times New Roman", serif;
}

html{scroll-behavior:smooth}

body{
  font-family:var(--serif);
  background:var(--parchment);
  color:var(--ink);
  min-height:100vh;
  line-height:1.65;
  /* subtle parchment grain */
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(201,149,42,.04) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(122,31,31,.03) 0%, transparent 50%);
}

/* ── HEADER ───────────────────────────────────── */
header{
  background: linear-gradient(180deg, var(--leather) 0%, var(--leather-2) 100%);
  border-bottom: 3px solid var(--gold);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-md);
  min-height: 72px;
}

.header-brand{
  display:flex;
  flex-direction:column;
  gap:.15rem;
}

.site-title{
  font-size: 1.55rem;
  font-weight: 500;
  color: var(--gold-light);
  letter-spacing: .03em;
}
.site-title em{
  font-style: italic;
  color: var(--gold);
}

.site-subtitle{
  font-size: .7rem;
  color: var(--gold-pale);
  opacity: .6;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.header-right{
  display:flex;
  align-items:center;
  gap:1rem;
}

.header-tehillim{
  font-family: var(--hebrew);
  font-size: 1.5rem;
  color: var(--gold-pale);
  opacity: .5;
  direction: rtl;
  letter-spacing: .04em;
  user-select: none;
}

/* Browse button */
.browse-btn{
  display:flex;
  align-items:center;
  gap:.5rem;
  padding:.45rem 1.1rem;
  background: rgba(201,149,42,.18);
  border: 1px solid rgba(201,149,42,.4);
  border-radius: 6px;
  color: var(--gold-light);
  font-family: var(--serif);
  font-size: .88rem;
  letter-spacing: .05em;
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .12s;
  white-space:nowrap;
}
.browse-btn:hover{
  background: rgba(201,149,42,.3);
  border-color: var(--gold);
  transform: translateY(-1px);
}
.browse-btn svg{ width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0 }

/* ── MAIN CONTENT ─────────────────────────────── */
main{
  max-width: 820px;
  margin: 0 auto;
  padding: 2.5rem 2rem 4rem;
}

/* ── PSALM HEADER ─────────────────────────────── */
.psalm-header{
  text-align: center;
  padding: 2rem 1rem 1.5rem;
  margin-bottom: 1.8rem;
  position: relative;
}

.psalm-number-display{
  font-size: .72rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--crimson);
  margin-bottom: .5rem;
  font-weight: 500;
}

.psalm-title-display{
  font-size: 2.4rem;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: .02em;
  line-height: 1.2;
  margin-bottom: .6rem;
}

.psalm-tagline{
  font-size: 1rem;
  font-style: italic;
  color: var(--ink-faint);
}

/* decorative rule */
.psalm-header::after{
  content:'';
  display:block;
  margin: 1.4rem auto 0;
  width: 120px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ── CONTROLS ─────────────────────────────────── */
.controls{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .6rem;
  margin-bottom: 2rem;
  padding: .9rem 1.2rem;
  background: var(--parchment-2);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.controls-label{
  font-size: .65rem;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--ink-faint);
  margin-right: .2rem;
}

.toggle-group{
  display: flex;
  gap: .3rem;
  flex-wrap: wrap;
}

.toggle-btn{
  padding: .3rem .75rem;
  border: 1px solid var(--divider);
  border-radius: 20px;
  background: var(--parchment);
  color: var(--ink-faint);
  font-family: var(--serif);
  font-size: .8rem;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .02em;
}
.toggle-btn:hover{ border-color: var(--crimson); color: var(--crimson); }
.toggle-btn.on{
  background: var(--crimson);
  border-color: var(--crimson);
  color: #fff;
  box-shadow: 0 1px 4px rgba(122,31,31,.3);
}

.controls-divider{
  width:1px;
  height:24px;
  background:var(--divider);
  margin: 0 .2rem;
}

.audio-btn{
  display:flex;
  align-items:center;
  gap:.4rem;
  padding:.32rem .85rem;
  border:1px solid;
  border-radius:20px;
  font-family:var(--serif);
  font-size:.78rem;
  cursor:pointer;
  transition:all .15s;
  letter-spacing:.02em;
}
.audio-btn.heb{ border-color:#9b4f2a; color:#9b4f2a; background:rgba(155,79,42,.06); }
.audio-btn.heb:hover{ background:#9b4f2a; color:#fff; }
.audio-btn.lat{ border-color:#4a6741; color:#4a6741; background:rgba(74,103,65,.06); }
.audio-btn.lat:hover{ background:#4a6741; color:#fff; }
.audio-btn.stop{ border-color:var(--ink-faint); color:var(--ink-faint); background:transparent; }
.audio-btn.stop:hover{ background:var(--ink-faint); color:#fff; }

/* ── VERSE LIST ───────────────────────────────── */
.verse-list{ display:flex; flex-direction:column; gap:1.4rem; }

/* ── VERSE BLOCK ──────────────────────────────── */
.verse-block{
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, border-color .2s;
}
.verse-block:hover{ box-shadow: var(--shadow-md); }
.verse-block.speaking{
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,149,42,.25), var(--shadow-md);
}

/* verse number bar */
.vbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.45rem 1rem;
  background: var(--leather);
  border-bottom: 1px solid rgba(201,149,42,.25);
}
.vbar-num{
  font-size:.72rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:500;
}
.vbar-actions{ display:flex; gap:.4rem; }
.vbar-btn{
  padding:.2rem .6rem;
  border:1px solid rgba(201,149,42,.35);
  border-radius:4px;
  background:rgba(201,149,42,.1);
  color:var(--gold-pale);
  font-family:var(--serif);
  font-size:.72rem;
  cursor:pointer;
  transition:background .14s;
  letter-spacing:.03em;
}
.vbar-btn:hover{ background:rgba(201,149,42,.28); }

/* language panels */
.lang-panel{
  padding:1rem 1.1rem;
  border-bottom:1px solid var(--divider);
  transition:background .15s;
}
.lang-panel:last-child{ border-bottom:none; }
.lang-panel.hidden{ display:none; }

.lang-panel.heb-panel{ background:var(--heb-tint); }
.lang-panel.lat-panel{ background:var(--lat-tint); }
.lang-panel.kjv-panel{ background:var(--kjv-tint); }
.lang-panel.esv-panel{ background:var(--esv-tint); }
.lang-panel.rsv-panel{ background:var(--rsv-tint); }

.lang-label{
  display:flex;
  align-items:center;
  gap:.45rem;
  font-size:.6rem;
  text-transform:uppercase;
  letter-spacing:.15em;
  color:var(--ink-faint);
  margin-bottom:.45rem;
}
.lang-pip{
  width:6px;height:6px;
  border-radius:50%;
  flex-shrink:0;
}
.pip-heb{background:#9b4f2a}
.pip-lat{background:#4a6741}
.pip-kjv{background:#7a6040}
.pip-esv{background:#3d6b8a}
.pip-rsv{background:#6b4a8a}

.original-text{
  font-size:1.2rem;
  line-height:1.85;
  color:var(--ink);
  margin-bottom:.45rem;
}
.heb-panel .original-text{
  font-family:var(--hebrew);
  direction:rtl;
  font-size:1.55rem;
  letter-spacing:.03em;
}

.phonetic{
  font-size:.82rem;
  font-style:italic;
  color:var(--ink-mid);
  line-height:1.75;
  opacity:.85;
}
.ph-stress{ color:var(--crimson); font-style:normal; font-weight:600; }
.ph-dot{ color:var(--ink-faint); margin:0 .05em; }

/* ── PSALM NAV ────────────────────────────────── */
.psalm-nav{
  display:flex;
  justify-content:space-between;
  gap:1rem;
  margin-top:2.5rem;
  padding-top:1.5rem;
  border-top:1px solid var(--divider);
}
.nav-btn{
  display:flex;
  align-items:center;
  gap:.5rem;
  padding:.55rem 1.4rem;
  background:var(--parchment-2);
  border:1px solid var(--divider);
  border-radius:6px;
  font-family:var(--serif);
  font-size:.9rem;
  color:var(--ink-mid);
  cursor:pointer;
  transition:all .15s;
  letter-spacing:.02em;
}
.nav-btn:hover{
  background:var(--crimson);
  border-color:var(--crimson);
  color:#fff;
  box-shadow:0 2px 8px rgba(122,31,31,.3);
}
.nav-btn:disabled{opacity:.35;cursor:default;pointer-events:none}

/* ── LOADING ──────────────────────────────────── */
.loading-wrap{
  text-align:center;
  padding:5rem 2rem;
  color:var(--ink-faint);
}
.spinner{
  width:2.5rem;height:2.5rem;
  border:3px solid var(--divider);
  border-top-color:var(--crimson);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 1.2rem;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap p{ font-style:italic; font-size:1.05rem; }

/* ── BACK TO TOP ──────────────────────────────── */
#back-top{
  position:fixed;
  bottom:1.5rem;right:1.5rem;
  width:42px;height:42px;
  background:var(--crimson);
  color:#fff;
  border:none;border-radius:50%;
  font-size:1.1rem;
  cursor:pointer;
  display:none;align-items:center;justify-content:center;
  box-shadow:var(--shadow-md);
  transition:opacity .2s, transform .2s;
  z-index:200;
}
#back-top.vis{display:flex}
#back-top:hover{opacity:.85;transform:translateY(-2px)}

/* ═══════════════════════════════════════════════
   OVERLAY
   ═══════════════════════════════════════════════ */

.ov-backdrop{
  position:fixed;inset:0;
  background:rgba(15,5,2,.75);
  backdrop-filter:blur(4px);
  z-index:300;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease;
}
.ov-backdrop.open{opacity:1;pointer-events:all}

.ov-panel{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-48%) scale(.97);
  width:min(94vw,860px);
  max-height:88vh;
  background:var(--parchment);
  border:2px solid var(--divider);
  border-radius:14px;
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(201,149,42,.15) inset;
  z-index:301;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease, transform .28s ease;
  overflow:hidden;
}
.ov-panel.open{
  opacity:1;pointer-events:all;
  transform:translate(-50%,-50%) scale(1);
}

.ov-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:1.3rem 1.6rem 1.1rem;
  background:linear-gradient(180deg,var(--leather) 0%,var(--leather-2) 100%);
  border-bottom:2px solid var(--gold);
  flex-shrink:0;
}
.ov-head-title{
  font-family:var(--hebrew);
  font-size:1.5rem;
  color:var(--gold-light);
  letter-spacing:.04em;
}
.ov-head-sub{
  font-size:.72rem;
  color:var(--gold-pale);
  opacity:.6;
  margin-top:.25rem;
  letter-spacing:.1em;
}
.ov-close{
  width:32px;height:32px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  color:var(--gold-light);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;
  flex-shrink:0;
  margin-left:1rem;
  transition:background .15s;
}
.ov-close:hover{background:rgba(255,255,255,.22)}

.ov-body{
  overflow-y:auto;
  padding:1.4rem 1.6rem 1.8rem;
  flex:1;
}

.psalm-book-section{ margin-bottom:1.8rem }
.psalm-book-section:last-child{margin-bottom:0}

.book-head{
  display:flex;align-items:center;gap:.75rem;
  margin-bottom:.9rem;
}
.book-head::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,var(--divider),transparent);
}
.book-roman{
  font-size:1rem;font-weight:600;
  color:var(--crimson);letter-spacing:.06em;
  flex-shrink:0;
}
.book-name{
  font-size:.64rem;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-faint);
  white-space:nowrap;flex-shrink:0;
}

.num-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
  gap:.45rem;
}

.ps-cell{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:.55rem .25rem .45rem;
  border:1px solid var(--divider);
  border-radius:7px;
  background:var(--parchment-2);
  cursor:pointer;
  text-decoration:none;
  color:var(--ink);
  transition:background .14s,border-color .14s,transform .12s,box-shadow .14s;
  position:relative;overflow:hidden;
}
.ps-cell:hover{
  background:#f0e3c0;
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(30,12,6,.15);
}
.ps-cell.active{
  background:var(--crimson);
  border-color:var(--crimson);
  color:#fff;
  box-shadow:0 3px 12px rgba(122,31,31,.4);
}
.ps-cell.active .cn{ color:var(--gold-light) }
.ps-cell.active .ci{ color:rgba(255,255,255,.65) }
.ps-cell.dimmed{ opacity:.4;cursor:default }
.ps-cell.dimmed:hover{transform:none;box-shadow:none;border-color:var(--divider);background:var(--parchment-2)}

.cn{ font-size:1.15rem;font-weight:500;line-height:1.2;letter-spacing:.01em }
.ci{
  font-size:.58rem;font-style:italic;
  color:var(--ink-faint);text-align:center;
  line-height:1.3;margin-top:.18rem;
  max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
  padding:0 3px;
}

.ov-foot{
  padding:.65rem 1.6rem;
  background:var(--parchment-2);
  border-top:1px solid var(--divider);
  font-size:.7rem;
  color:var(--ink-faint);
  text-align:center;
  letter-spacing:.04em;
  flex-shrink:0;
}
kbd{
  display:inline-block;
  padding:.1rem .4rem;
  background:var(--parchment);
  border:1px solid var(--divider);
  border-radius:3px;
  font-family:inherit;font-size:.68rem;
}

/* ── RESPONSIVE ───────────────────────────────── */
@media(max-width:640px){
  header{padding:0 1rem;min-height:60px}
  .site-title{font-size:1.2rem}
  .header-tehillim{display:none}
  main{padding:1.5rem 1rem 3rem}
  .psalm-title-display{font-size:1.8rem}
  .ov-panel{width:96vw;max-height:91vh}
  .num-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:.32rem}
  .ci{display:none}
  .browse-btn span{display:none}
  .controls{padding:.7rem}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-brand">
    <div class="site-title">Psalms &middot; <em>Ancient Voices</em></div>
    <div class="site-subtitle">Hebrew &bull; Latin &bull; KJV &bull; ESV &bull; RSV &bull; Pronunciation</div>
  </div>

  <div class="header-right">
    <button class="browse-btn" id="browse-btn" onclick="openOverlay()">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>All Psalms</span>
    </button>
    <div class="header-tehillim" title="Tehillim — Praises">&#x05EA;&#x05B0;&#x05D4;&#x05B4;&#x05DC;&#x05BC;&#x05B4;&#x05D9;&#x05DD;</div>
  </div>
</header>

<!-- OVERLAY BACKDROP -->
<div class="ov-backdrop" id="ov-backdrop" onclick="closeOverlay()"></div>

<!-- OVERLAY PANEL -->
<div class="ov-panel" id="ov-panel" role="dialog" aria-modal="true" aria-label="Select a Psalm">
  <div class="ov-head">
    <div>
      <div class="ov-head-title">&#x05EA;&#x05B0;&#x05D4;&#x05B4;&#x05DC;&#x05BC;&#x05B4;&#x05D9;&#x05DD; &nbsp;&middot;&nbsp; Psalms</div>
      <div class="ov-head-sub">Select a psalm to read and sing</div>
    </div>
    <button class="ov-close" onclick="closeOverlay()" aria-label="Close">&#x2715;</button>
  </div>
  <div class="ov-body" id="ov-body"></div>
  <div class="ov-foot">Click a number to open that psalm &nbsp;&middot;&nbsp; <kbd>Esc</kbd> to close</div>
</div>

<!-- MAIN -->
<main>
  <div id="psalm-header" class="psalm-header">
    <div class="loading-wrap"><div class="spinner"></div><p>Loading&hellip;</p></div>
  </div>

  <div class="controls" id="controls" style="display:none">
    <span class="controls-label">Show</span>
    <div class="toggle-group">
      <button class="toggle-btn on" id="btn-he"  onclick="toggleLang('he')">Hebrew</button>
      <button class="toggle-btn on" id="btn-la"  onclick="toggleLang('la')">Latin</button>
      <button class="toggle-btn on" id="btn-kjv" onclick="toggleLang('kjv')">KJV</button>
      <button class="toggle-btn on" id="btn-esv" onclick="toggleLang('esv')">ESV</button>
      <button class="toggle-btn"   id="btn-rsv" onclick="toggleLang('rsv')">RSV</button>
    </div>
    <div class="controls-divider"></div>
    <button class="audio-btn heb" onclick="speakAll('he')">&#x25B6; Hebrew</button>
    <button class="audio-btn lat" onclick="speakAll('la')">&#x25B6; Latin</button>
    <button class="audio-btn stop" onclick="stopSpeaking()">&#x25A0; Stop</button>
  </div>

  <div class="verse-list" id="verse-list">
    <div class="loading-wrap"><div class="spinner"></div><p>Loading psalm data&hellip;</p></div>
  </div>

  <div class="psalm-nav">
    <button class="nav-btn" id="nav-prev" disabled onclick="goPrev()">&#x2190; Previous</button>
    <button class="nav-btn" id="nav-next" onclick="goNext()">Next &#x2192;</button>
  </div>
</main>

<button id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#x2191;</button>

<script>
// ─── PSALM DATA ───────────────────────────────────────────────────────────────
const PSALMS = [{"psalm":1,"title":"Psalm 1","superscript":"The Two Ways","verses":[{"verse":1,"hebrew":"אַשְׁרֵי הָאִישׁ אֲשֶׁר לֹא הָלַךְ בַּעֲצַת רְשָׁעִים וּבְדֶרֶךְ חַטָּאִים לֹא עָמָד וּבְמוֹשַׁב לֵצִים לֹא יָשָׁב׃","latin":"Beatus vir, qui non abiit in consilio impiorum, et in via peccatorum non stetit, et in cathedra pestilentiae non sedit;","kjv":"Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful.","esv":"Blessed is the man who walks not in the counsel of the wicked, nor stands in the way of sinners, nor sits in the seat of scoffers;","rsv":"Blessed is the man who walks not in the counsel of the wicked, nor stands in the way of sinners, nor sits in the seat of scoffers;"},{"verse":2,"hebrew":"כִּי אִם בְּתוֹרַת יְהוָה חֶפְצוֹ וּבְתוֹרָתוֹ יֶהְגֶּה יוֹמָם וָלָיְלָה׃","latin":"sed in lege Domini voluntas ejus, et in lege ejus meditabitur die ac nocte.","kjv":"But his delight is in the law of the LORD; and in his law doth he meditate day and night.","esv":"but his delight is in the law of the LORD, and on his law he meditates day and night.","rsv":"but his delight is in the law of the LORD, and on his law he meditates day and night."},{"verse":3,"hebrew":"וְהָיָה כְּעֵץ שָׁתוּל עַל פַּלְגֵי מָיִם אֲשֶׁר פִּרְיוֹ יִתֵּן בְּעִתּוֹ וְעָלֵהוּ לֹא יִבּוֹל וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ׃","latin":"Et erit tamquam lignum, quod plantatum est secus decursus aquarum, quod fructum suum dabit in tempore suo; et folium ejus non defluet; et omnia, quaecumque faciet, prosperabuntur.","kjv":"And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither; and whatsoever he doeth shall prosper.","esv":"He is like a tree planted by streams of water that yields its fruit in its season, and its leaf does not wither. In all that he does, he prospers.","rsv":"He is like a tree planted by streams of water, that yields its fruit in its season, and its leaf does not wither. In all that he does, he prospers."},{"verse":4,"hebrew":"לֹא כֵן הָרְשָׁעִים כִּי אִם כַּמֹּץ אֲשֶׁר תִּדְּפֶנּוּ רוּחַ׃","latin":"Non sic impii, non sic; sed tamquam pulvis, quem projicit ventus a facie terrae.","kjv":"The ungodly are not so: but are like the chaff which the wind driveth away.","esv":"The wicked are not so, but are like chaff that the wind drives away.","rsv":"The wicked are not so, but are like chaff which the wind drives away."},{"verse":5,"hebrew":"עַל כֵּן לֹא יָקֻמוּ רְשָׁעִים בַּמִּשְׁפָּט וְחַטָּאִים בַּעֲדַת צַדִּיקִים׃","latin":"Ideo non resurgent impii in judicio, neque peccatores in concilio justorum.","kjv":"Therefore the ungodly shall not stand in the judgment, nor sinners in the congregation of the righteous.","esv":"Therefore the wicked will not stand in the judgment, nor sinners in the congregation of the righteous;","rsv":"Therefore the wicked will not stand in the judgment, nor sinners in the congregation of the righteous;"},{"verse":6,"hebrew":"כִּי יוֹדֵעַ יְהוָה דֶּרֶךְ צַדִּיקִים וְדֶרֶךְ רְשָׁעִים תֹּאבֵד׃","latin":"Quoniam novit Dominus viam justorum; et iter impiorum peribit.","kjv":"For the LORD knoweth the way of the righteous: but the way of the ungodly shall perish.","esv":"for the LORD knows the way of the righteous, but the way of the wicked will perish.","rsv":"for the LORD knows the way of the righteous, but the way of the wicked will perish."}]},{"psalm":22,"title":"Psalm 22","superscript":"My God, My God — A Cry of Desolation and Praise","verses":[{"verse":1,"hebrew":"לַמְנַצֵּחַ עַל אַיֶּלֶת הַשַּׁחַר מִזְמוֹר לְדָוִד׃","latin":"In finem, pro susceptione matutina. Psalmus David.","kjv":"[To the chief Musician upon Aijeleth Shahar, A Psalm of David.]","esv":"[To the choirmaster: according to The Doe of the Dawn. A Psalm of David.]","rsv":"[To the choirmaster: according to The Hind of the Dawn. A Psalm of David.]"},{"verse":2,"hebrew":"אֵלִי אֵלִי לָמָה עֲזַבְתָּנִי רָחוֹק מִישׁוּעָתִי דִּבְרֵי שַׁאֲגָתִי׃","latin":"Deus, Deus meus, respice in me: quare me dereliquisti? longe a salute mea verba delictorum meorum.","kjv":"My God, my God, why hast thou forsaken me? why art thou so far from helping me, and from the words of my roaring?","esv":"My God, my God, why have you forsaken me? Why are you so far from saving me, from the words of my groaning?","rsv":"My God, my God, why hast thou forsaken me? Why art thou so far from helping me, from the words of my groaning?"},{"verse":3,"hebrew":"אֱלֹהַי אֶקְרָא יוֹמָם וְלֹא תַעֲנֶה וְלַיְלָה וְלֹא דוּמִיָּה לִי׃","latin":"Deus meus, clamabo per diem, et non exaudies; et nocte, et non ad insipientiam mihi.","kjv":"O my God, I cry in the daytime, but thou hearest not; and in the night season, and am not silent.","esv":"O my God, I cry by day, but you do not answer, and by night, but I find no rest.","rsv":"O my God, I cry by day, but thou dost not answer; and by night, but find no rest."},{"verse":4,"hebrew":"וְאַתָּה קָדוֹשׁ יוֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל׃","latin":"Tu autem in sancto habitas, laus Israel.","kjv":"But thou art holy, O thou that inhabitest the praises of Israel.","esv":"Yet you are holy, enthroned on the praises of Israel.","rsv":"Yet thou art holy, enthroned on the praises of Israel."},{"verse":5,"hebrew":"בְּךָ בָּטְחוּ אֲבֹתֵינוּ בָּטְחוּ וַתְּפַלְּטֵמוֹ׃","latin":"In te speraverunt patres nostri: speraverunt, et liberasti eos.","kjv":"Our fathers trusted in thee: they trusted, and thou didst deliver them.","esv":"In you our fathers trusted; they trusted, and you delivered them.","rsv":"In thee our fathers trusted; they trusted, and thou didst deliver them."},{"verse":6,"hebrew":"אֵלֶיךָ זָעֲקוּ וְנִמְלָטוּ בְּךָ בָטְחוּ וְלֹא בוֹשׁוּ׃","latin":"Ad te clamaverunt, et salvi facti sunt; in te speraverunt, et non sunt confusi.","kjv":"They cried unto thee, and were delivered: they trusted in thee, and were not confounded.","esv":"To you they cried and were rescued; in you they trusted and were not put to shame.","rsv":"To thee they cried, and were saved; in thee they trusted, and were not disappointed."},{"verse":7,"hebrew":"וְאָנֹכִי תוֹלַעַת וְלֹא אִישׁ חֶרְפַּת אָדָם וּבְזוּי עָם׃","latin":"Ego autem sum vermis, et non homo; opprobrium hominum, et abjectio plebis.","kjv":"But I am a worm, and no man; a reproach of men, and despised of the people.","esv":"But I am a worm and not a man, scorned by mankind and despised by the people.","rsv":"But I am a worm, and no man; scorned by men, and despised by the people."},{"verse":8,"hebrew":"כָּל רֹאַי יַלְעִגוּ לִי יַפְטִירוּ בְשָׂפָה יָנִיעוּ רֹאשׁ׃","latin":"Omnes videntes me, deriserunt me; locuti sunt labiis, et moverunt caput.","kjv":"All they that see me laugh me to scorn: they shoot out the lip, they shake the head,","esv":"All who see me mock me; they make mouths at me; they wag their heads;","rsv":"All who see me mock at me, they make mouths at me, they wag their heads;"},{"verse":9,"hebrew":"גֹּל אֶל יְהוָה יְפַלְּטֵהוּ יַצִּילֵהוּ כִּי חָפֵץ בוֹ׃","latin":"Speravit in Domino, eripiat eum; salvum faciat eum, quoniam vult eum.","kjv":"He trusted on the LORD that he would deliver him: let him deliver him, seeing he delighted in him.","esv":"\"He trusts in the LORD; let him deliver him; let him rescue him, for he delights in him!\"","rsv":"\"He committed his cause to the LORD; let him deliver him, let him rescue him, for he delights in him!\""},{"verse":10,"hebrew":"כִּי אַתָּה גֹחִי מִבָּטֶן מַבְטִיחִי עַל שְׁדֵי אִמִּי׃","latin":"Quoniam tu es, qui extraxisti me de ventre; spes mea ab uberibus matris meae.","kjv":"But thou art he that took me out of the womb: thou didst make me hope when I was upon my mother's breasts.","esv":"Yet you are he who took me from the womb; you made me trust you at my mother's breasts.","rsv":"Yet thou art he who took me from the womb; thou didst keep me safe upon my mother's breasts."},{"verse":11,"hebrew":"עָלֶיךָ הָשְׁלַכְתִּי מֵרָחֶם מִבֶּטֶן אִמִּי אֵלִי אָתָּה׃","latin":"In te projectus sum ex utero; de ventre matris meae Deus meus es tu.","kjv":"I was cast upon thee from the womb: thou art my God from my mother's belly.","esv":"On you was I cast from my birth, and from my mother's womb you have been my God.","rsv":"Upon thee was I cast from my birth, and since my mother bore me thou hast been my God."},{"verse":12,"hebrew":"אַל תִּרְחַק מִמֶּנִּי כִּי צָרָה קְרוֹבָה כִּי אֵין עוֹזֵר׃","latin":"Ne discesseris a me; quoniam tribulatio proxima est, quoniam non est qui adjuvet.","kjv":"Be not far from me; for trouble is near; for there is none to help.","esv":"Be not far from me, for trouble is near, and there is none to help.","rsv":"Be not far from me, for trouble is near and there is none to help."},{"verse":13,"hebrew":"סְבָבוּנִי פָּרִים רַבִּים אַבִּירֵי בָשָׁן כִּתְּרוּנִי׃","latin":"Circumdederunt me vituli multi; tauri pingues obsederunt me.","kjv":"Many bulls have compassed me: strong bulls of Bashan have beset me round.","esv":"Many bulls encompass me; strong bulls of Bashan surround me;","rsv":"Many bulls encompass me, strong bulls of Bashan surround me;"},{"verse":14,"hebrew":"פָּצוּ עָלַי פִּיהֶם אַרְיֵה טֹרֵף וְשֹׁאֵג׃","latin":"Aperuerunt super me os suum, sicut leo rapiens et rugiens.","kjv":"They gaped upon me with their mouths, as a ravening and a roaring lion.","esv":"they open wide their mouths at me, like a ravening and roaring lion.","rsv":"they open wide their mouths at me, like a ravening and roaring lion."},{"verse":15,"hebrew":"כַּמַּיִם נִשְׁפַּכְתִּי וְהִתְפָּרְדוּ כָּל עַצְמוֹתָי הָיָה לִבִּי כַּדּוֹנָג נָמֵס בְּתוֹךְ מֵעָי׃","latin":"Sicut aqua effusus sum; et dispersa sunt omnia ossa mea. Factum est cor meum tamquam cera liquescens in medio ventris mei.","kjv":"I am poured out like water, and all my bones are out of joint: my heart is like wax; it is melted in the midst of my bowels.","esv":"I am poured out like water, and all my bones are out of joint; my heart is like wax; it is melted within my breast;","rsv":"I am poured out like water, and all my bones are out of joint; my heart is like wax, it is melted within my breast;"},{"verse":16,"hebrew":"יָבֵשׁ כַּחֶרֶשׂ כֹּחִי וּלְשׁוֹנִי מֻדְבָּק מַלְקוֹחָי וְלַעֲפַר מָוֶת תִּשְׁפְּתֵנִי׃","latin":"Aruit tamquam testa virtus mea, et lingua mea adhaesit faucibus meis; et in pulverem mortis deduxisti me.","kjv":"My strength is dried up like a potsherd; and my tongue cleaveth to my jaws; and thou hast brought me into the dust of death.","esv":"my strength is dried up like a potsherd; and my tongue sticks to my jaws; you lay me in the dust of death.","rsv":"my strength is dried up like a potsherd; and my tongue cleaves to my jaws; thou dost lay me in the dust of death."},{"verse":17,"hebrew":"כִּי סְבָבוּנִי כְּלָבִים עֲדַת מְרֵעִים הִקִּיפוּנִי כָּאֲרִי יָדַי וְרַגְלָי׃","latin":"Quoniam circumdederunt me canes multi; concilium malignantium obsedit me. Foderunt manus meas et pedes meos;","kjv":"For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet.","esv":"For dogs encompass me; a company of evildoers encircles me; they have pierced my hands and feet—","rsv":"Yea, dogs are round about me; a company of evildoers encircle me; they have pierced my hands and feet—"},{"verse":18,"hebrew":"אֲסַפֵּר כָּל עַצְמוֹתָי הֵמָּה יַבִּיטוּ יִרְאוּ בִי׃","latin":"dinumeraverunt omnia ossa mea. Ipsi vero consideraverunt et inspexerunt me.","kjv":"I may tell all my bones: they look and stare upon me.","esv":"I can count all my bones— they stare and gloat over me;","rsv":"I can count all my bones— they stare and gloat over me;"},{"verse":19,"hebrew":"יְחַלְּקוּ בְגָדַי לָהֶם וְעַל לְבוּשִׁי יַפִּילוּ גוֹרָל׃","latin":"Diviserunt sibi vestimenta mea, et super vestem meam miserunt sortem.","kjv":"They part my garments among them, and cast lots upon my vesture.","esv":"they divide my garments among them, and for my clothing they cast lots.","rsv":"they divide my garments among them, and for my raiment they cast lots."},{"verse":20,"hebrew":"וְאַתָּה יְהוָה אַל תִּרְחָק אֱיָלוּתִי לְעֶזְרָתִי חוּשָׁה׃","latin":"Tu autem, Domine, ne elongaveris auxilium tuum a me; ad defensionem meam conspice.","kjv":"But be not thou far from me, O LORD: O my strength, haste thee to help me.","esv":"But you, O LORD, do not be far off! O you my help, come quickly to my aid!","rsv":"But thou, O LORD, be not far off! O thou my help, hasten to my aid!"},{"verse":21,"hebrew":"הַצִּילָה מֵחֶרֶב נַפְשִׁי מִיַּד כֶּלֶב יְחִידָתִי׃","latin":"Erue a framea, Deus, animam meam; et de manu canis unicam meam.","kjv":"Deliver my soul from the sword; my darling from the power of the dog.","esv":"Deliver my soul from the sword, my precious life from the power of the dog!","rsv":"Deliver my soul from the sword, my life from the power of the dog!"},{"verse":22,"hebrew":"הוֹשִׁיעֵנִי מִפִּי אַרְיֵה וּמִקַּרְנֵי רֵמִים עֲנִיתָנִי׃","latin":"Salva me ex ore leonis; et a cornibus unicornium humilitatem meam.","kjv":"Save me from the lion's mouth: for thou hast heard me from the horns of the unicorns.","esv":"Save me from the mouth of the lion! You have rescued me from the horns of the wild oxen!","rsv":"Save me from the mouth of the lion, my afflicted soul from the horns of the wild oxen!"},{"verse":23,"hebrew":"אֲסַפְּרָה שִׁמְךָ לְאֶחָי בְּתוֹךְ קָהָל אֲהַלְלֶךָּ׃","latin":"Narrabo nomen tuum fratribus meis; in medio ecclesiae laudabo te.","kjv":"I will declare thy name unto my brethren: in the midst of the congregation will I praise thee.","esv":"I will tell of your name to my brothers; in the midst of the congregation I will praise you:","rsv":"I will tell of thy name to my brethren; in the midst of the congregation I will praise thee:"},{"verse":24,"hebrew":"יִרְאֵי יְהוָה הַלְלוּהוּ כָּל זֶרַע יַעֲקֹב כַּבְּדוּהוּ וְגוּרוּ מִמֶּנּוּ כָּל זֶרַע יִשְׂרָאֵל׃","latin":"Qui timetis Dominum, laudate eum; universum semen Jacob, glorificate eum.","kjv":"Ye that fear the LORD, praise him; all ye the seed of Jacob, glorify him; and fear him, all ye the seed of Israel.","esv":"You who fear the LORD, praise him! All you offspring of Jacob, glorify him, and stand in awe of him, all you offspring of Israel!","rsv":"You who fear the LORD, praise him! all you sons of Jacob, glorify him, and stand in awe of him, all you sons of Israel!"},{"verse":25,"hebrew":"כִּי לֹא בָזָה וְלֹא שִׁקַּץ עֱנוּת עָנִי וְלֹא הִסְתִּיר פָּנָיו מִמֶּנּוּ וּבְשַׁוְּעוֹ אֵלָיו שָׁמֵעַ׃","latin":"Quoniam non sprevit, neque despexit deprecationem pauperis; nec avertit faciem suam a me; et cum clamaret ad eum, exaudivit eum.","kjv":"For he hath not despised nor abhorred the affliction of the afflicted; neither hath he hidden his face from him; but when he cried unto him, he heard.","esv":"For he has not despised or scorned the suffering of the afflicted one; he has not hidden his face from him but has listened to his cry for help.","rsv":"For he has not despised or abhorred the affliction of the afflicted; and he has not hid his face from him, but has heard, when he cried to him."},{"verse":26,"hebrew":"מֵאִתְּךָ תְהִלָּתִי בְּקָהָל רָב נְדָרַי אֲשַׁלֵּם נֶגֶד יְרֵאָיו׃","latin":"Apud te laus mea in ecclesia magna; vota mea reddam in conspectu timentium eum.","kjv":"My praise shall be of thee in the great congregation: I will pay my vows before them that fear him.","esv":"From you comes my praise in the great congregation; my vows I will perform before those who fear him.","rsv":"From thee comes my praise in the great congregation; my vows I will pay before those who fear him."},{"verse":27,"hebrew":"יֹאכְלוּ עֲנָוִים וְיִשְׂבָּעוּ יְהַלְלוּ יְהוָה דֹּרְשָׁיו יְחִי לְבַבְכֶם לָעַד׃","latin":"Edent pauperes, et saturabuntur; et laudabunt Dominum, qui requirunt eum; vivent corda eorum in saeculum saeculi.","kjv":"The meek shall eat and be satisfied: they shall praise the LORD that seek him: your heart shall live for ever.","esv":"The afflicted shall eat and be satisfied; those who seek him shall praise the LORD! May your hearts live forever!","rsv":"The afflicted shall eat and be satisfied; those who seek him shall praise the LORD! May your hearts live for ever!"},{"verse":28,"hebrew":"יִזְכְּרוּ וְיָשֻׁבוּ אֶל יְהוָה כָּל אַפְסֵי אָרֶץ וְיִשְׁתַּחֲווּ לְפָנֶיךָ כָּל מִשְׁפְּחוֹת גּוֹיִם׃","latin":"Reminiscentur, et convertentur ad Dominum universi fines terrae; et adorabunt in conspectu ejus universae familiae gentium.","kjv":"All the ends of the world shall remember and turn unto the LORD: and all the kindreds of the nations shall worship before thee.","esv":"All the ends of the earth shall remember and turn to the LORD, and all the families of the nations shall worship before you.","rsv":"All the ends of the earth shall remember and turn to the LORD; and all the families of the nations shall worship before him."},{"verse":29,"hebrew":"כִּי לַיהוָה הַמְּלוּכָה וּמֹשֵׁל בַּגּוֹיִם׃","latin":"Quoniam Domini est regnum; et ipse dominabitur gentium.","kjv":"For the kingdom is the LORD's: and he is the governor among the nations.","esv":"For kingship belongs to the LORD, and he rules over the nations.","rsv":"For dominion belongs to the LORD, and he rules over the nations."},{"verse":30,"hebrew":"אָכְלוּ וַיִּשְׁתַּחֲווּ כָּל דִּשְׁנֵי אֶרֶץ לְפָנָיו יִכְרְעוּ כָּל יוֹרְדֵי עָפָר וְנַפְשׁוֹ לֹא חִיָּה׃","latin":"Manducaverunt et adoraverunt omnes pingues terrae; in conspectu ejus cadent omnes qui descendunt in terram.","kjv":"All they that be fat upon earth shall eat and worship: all they that go down to the dust shall bow before him: and none can keep alive his own soul.","esv":"All the prosperous of the earth eat and worship; before him shall bow all who go down to the dust, even the one who could not keep himself alive.","rsv":"Yea, to him shall all the proud of the earth bow down; before him shall bow all who go down to the dust, and he who cannot keep himself alive."},{"verse":31,"hebrew":"זֶרַע יַעַבְדֶנּוּ יְסֻפַּר לַאדֹנָי לַדּוֹר׃","latin":"Et semen meum serviet ipsi; annuntiabitur Domino generatio ventura.","kjv":"A seed shall serve him; it shall be accounted to the Lord for a generation.","esv":"Posterity shall serve him; it shall be told of the Lord to the coming generation;","rsv":"Posterity shall serve him; men shall tell of the Lord to the coming generation,"},{"verse":32,"hebrew":"יָבֹאוּ וְיַגִּידוּ צִדְקָתוֹ לְעַם נוֹלָד כִּי עָשָׂה׃","latin":"Et annuntiabunt justitiam ejus populo qui nascetur, quem fecit Dominus.","kjv":"They shall come, and shall declare his righteousness unto a people that shall be born, that he hath done this.","esv":"they shall come and proclaim his righteousness to a people yet unborn, that he has done it.","rsv":"and proclaim his deliverance to a people yet unborn, that he has wrought it."}]},{"psalm":23,"title":"Psalm 23","superscript":"The Lord is My Shepherd","verses":[{"verse":1,"hebrew":"מִזְמוֹר לְדָוִד יְהוָה רֹעִי לֹא אֶחְסָר׃","latin":"Psalmus David. Dominus regit me, et nihil mihi deerit:","kjv":"The LORD is my shepherd; I shall not want.","esv":"The LORD is my shepherd; I shall not want.","rsv":"The LORD is my shepherd, I shall not want;"},{"verse":2,"hebrew":"בִּנְאוֹת דֶּשֶׁא יַרְבִּיצֵנִי עַל מֵי מְנֻחוֹת יְנַהֲלֵנִי׃","latin":"in loco pascuae ibi me collocavit. Super aquam refectionis educavit me;","kjv":"He maketh me to lie down in green pastures: he leadeth me beside the still waters.","esv":"He makes me lie down in green pastures. He leads me beside still waters.","rsv":"he makes me lie down in green pastures. He leads me beside still waters;"},{"verse":3,"hebrew":"נַפְשִׁי יְשׁוֹבֵב יַנְחֵנִי בְמַעְגְּלֵי צֶדֶק לְמַעַן שְׁמוֹ׃","latin":"animam meam convertit. Deduxit me super semitas justitiae, propter nomen suum.","kjv":"He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.","esv":"He restores my soul. He leads me in paths of righteousness for his name's sake.","rsv":"he restores my soul. He leads me in paths of righteousness for his name's sake."},{"verse":4,"hebrew":"גַּם כִּי אֵלֵךְ בְּגֵיא צַלְמָוֶת לֹא אִירָא רָע כִּי אַתָּה עִמָּדִי שִׁבְטְךָ וּמִשְׁעַנְתֶּךָ הֵמָּה יְנַחֲמֻנִי׃","latin":"Nam etsi ambulavero in medio umbrae mortis, non timebo mala, quoniam tu mecum es. Virga tua et baculus tuus, ipsa me consolata sunt.","kjv":"Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.","esv":"Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me; your rod and your staff, they comfort me.","rsv":"Even though I walk through the valley of the shadow of death, I fear no evil; for thou art with me; thy rod and thy staff, they comfort me."},{"verse":5,"hebrew":"תַּעֲרֹךְ לְפָנַי שֻׁלְחָן נֶגֶד צֹרְרָי דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי כּוֹסִי רְוָיָה׃","latin":"Parasti in conspectu meo mensam, adversus eos qui tribulant me. Impinguasti in oleo caput meum; et calix meus inebrians quam praeclarus est!","kjv":"Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over.","esv":"You prepare a table before me in the presence of my enemies; you anoint my head with oil; my cup overflows.","rsv":"Thou preparest a table before me in the presence of my enemies; thou anointest my head with oil, my cup overflows."},{"verse":6,"hebrew":"אַךְ טוֹב וָחֶסֶד יִרְדְּפוּנִי כָּל יְמֵי חַיַּי וְשַׁבְתִּי בְּבֵית יְהוָה לְאֹרֶךְ יָמִים׃","latin":"Et misericordia tua subsequetur me omnibus diebus vitae meae; et ut inhabitem in domo Domini, in longitudinem dierum.","kjv":"Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever.","esv":"Surely goodness and mercy shall follow me all the days of my life, and I shall dwell in the house of the LORD forever.","rsv":"Surely goodness and mercy shall follow me all the days of my life; and I shall dwell in the house of the LORD for ever."}]},{"psalm":51,"title":"Psalm 51","superscript":"Miserere — Prayer of Repentance","verses":[{"verse":1,"hebrew":"לַמְנַצֵּחַ מִזְמוֹר לְדָוִד׃","latin":"In finem. Psalmus David,","kjv":"[To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bath-sheba.]","esv":"[To the choirmaster. A Psalm of David, when Nathan the prophet went to him, after he had gone in to Bathsheba.]","rsv":"[To the choirmaster. A Psalm of David, when Nathan the prophet came to him, after he had gone in to Bathsheba.]"},{"verse":2,"hebrew":"בְּבוֹא אֵלָיו נָתָן הַנָּבִיא כַּאֲשֶׁר בָּא אֶל בַּת שָׁבַע׃","latin":"cum venit ad eum Nathan propheta, quando intravit ad Bethsabee.","kjv":"Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.","esv":"Have mercy on me, O God, according to your steadfast love; according to your abundant mercy blot out my transgressions.","rsv":"Have mercy on me, O God, according to thy steadfast love; according to thy abundant mercy blot out my transgressions."},{"verse":3,"hebrew":"חָנֵּנִי אֱלֹהִים כְּחַסְדֶּךָ כְּרֹב רַחֲמֶיךָ מְחֵה פְשָׁעָי׃","latin":"Miserere mei, Deus, secundum magnam misericordiam tuam; et secundum multitudinem miserationum tuarum, dele iniquitatem meam.","kjv":"Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.","esv":"Have mercy on me, O God, according to your steadfast love; according to your abundant mercy blot out my transgressions.","rsv":"Have mercy on me, O God, according to thy steadfast love; according to thy abundant mercy blot out my transgressions."},{"verse":4,"hebrew":"הֶרֶב כַּבְּסֵנִי מֵעֲוֹנִי וּמֵחַטָּאתִי טַהֲרֵנִי׃","latin":"Amplius lava me ab iniquitate mea, et a peccato meo munda me.","kjv":"Wash me throughly from mine iniquity, and cleanse me from my sin.","esv":"Wash me thoroughly from my iniquity, and cleanse me from my sin!","rsv":"Wash me thoroughly from my iniquity, and cleanse me from my sin!"},{"verse":5,"hebrew":"כִּי פְשָׁעַי אֲנִי אֵדָע וְחַטָּאתִי נֶגְדִּי תָמִיד׃","latin":"Quoniam iniquitatem meam ego cognosco; et peccatum meum contra me est semper.","kjv":"For I acknowledge my transgressions: and my sin is ever before me.","esv":"For I know my transgressions, and my sin is ever before me.","rsv":"For I know my transgressions, and my sin is ever before me."},{"verse":6,"hebrew":"לְךָ לְבַדְּךָ חָטָאתִי וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי לְמַעַן תִּצְדַּק בְּדָבְרֶךָ תִּזְכֶּה בְשָׁפְטֶךָ׃","latin":"Tibi soli peccavi, et malum coram te feci; ut justificeris in sermonibus tuis, et vincas cum judicaris.","kjv":"Against thee, thee only, have I sinned, and done this evil in thy sight: that thou mightest be justified when thou speakest, and be clear when thou judgest.","esv":"Against you, you only, have I sinned and done what is evil in your sight, so that you may be justified in your words and blameless in your judgment.","rsv":"Against thee, thee only, have I sinned, and done that which is evil in thy sight, so that thou art justified in thy sentence and blameless in thy judgment."},{"verse":7,"hebrew":"הֵן בְּעָווֹן חוֹלָלְתִּי וּבְחֵטְא יֶחֱמַתְנִי אִמִּי׃","latin":"Ecce enim in iniquitatibus conceptus sum; et in peccatis concepit me mater mea.","kjv":"Behold, I was shapen in iniquity; and in sin did my mother conceive me.","esv":"Behold, I was brought forth in iniquity, and in sin did my mother conceive me.","rsv":"Behold, I was brought forth in iniquity, and in sin did my mother conceive me."},{"verse":8,"hebrew":"הֵן אֱמֶת חָפַצְתָּ בַטֻּחוֹת וּבְסָתֻם חָכְמָה תוֹדִיעֵנִי׃","latin":"Ecce enim veritatem dilexisti; incerta et occulta sapientiae tuae manifestasti mihi.","kjv":"Behold, thou desirest truth in the inward parts: and in the hidden part thou shalt make me to know wisdom.","esv":"Behold, you delight in truth in the inward being, and you teach me wisdom in the secret heart.","rsv":"Behold, thou desirest truth in the inward being; therefore teach me wisdom in my secret heart."},{"verse":9,"hebrew":"תְּחַטְּאֵנִי בְאֵזוֹב וְאֶטְהָר תְּכַבְּסֵנִי וּמִשֶּׁלֶג אַלְבִּין׃","latin":"Asperges me hyssopo, et mundabor; lavabis me, et super nivem dealbabor.","kjv":"Purge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow.","esv":"Purge me with hyssop, and I shall be clean; wash me, and I shall be whiter than snow.","rsv":"Purge me with hyssop, and I shall be clean; wash me, and I shall be whiter than snow."},{"verse":10,"hebrew":"תַּשְׁמִיעֵנִי שָׂשׂוֹן וְשִׂמְחָה תָּגֵלְנָה עֲצָמוֹת דִּכִּיתָ׃","latin":"Auditui meo dabis gaudium et laetitiam; et exsultabunt ossa humiliata.","kjv":"Make me to hear joy and gladness; that the bones which thou hast broken may rejoice.","esv":"Let me hear joy and gladness; let the bones that you have broken rejoice.","rsv":"Fill me with joy and gladness; let the bones which thou hast broken rejoice."},{"verse":11,"hebrew":"הַסְתֵּר פָּנֶיךָ מֵחֲטָאָי וְכָל עֲוֹנֹתַי מְחֵה׃","latin":"Averte faciem tuam a peccatis meis; et omnes iniquitates meas dele.","kjv":"Hide thy face from my sins, and blot out all mine iniquities.","esv":"Hide your face from my sins, and blot out all my iniquities.","rsv":"Hide thy face from my sins, and blot out all my iniquities."},{"verse":12,"hebrew":"לֵב טָהוֹר בְּרָא לִי אֱלֹהִים וְרוּחַ נָכוֹן חַדֵּשׁ בְּקִרְבִּי׃","latin":"Cor mundum crea in me, Deus; et spiritum rectum innova in visceribus meis.","kjv":"Create in me a clean heart, O God; and renew a right spirit within me.","esv":"Create in me a clean heart, O God, and renew a right spirit within me.","rsv":"Create in me a clean heart, O God, and put a new and right spirit within me."},{"verse":13,"hebrew":"אַל תַּשְׁלִיכֵנִי מִלְּפָנֶיךָ וְרוּחַ קָדְשְׁךָ אַל תִּקַּח מִמֶּנִּי׃","latin":"Ne projicias me a facie tua; et spiritum sanctum tuum ne auferas a me.","kjv":"Cast me not away from thy presence; and take not thy holy spirit from me.","esv":"Cast me not away from your presence, and take not your Holy Spirit from me.","rsv":"Cast me not away from thy presence, and take not thy holy Spirit from me."},{"verse":14,"hebrew":"הָשִׁיבָה לִּי שְׂשׂוֹן יִשְׁעֶךָ וְרוּחַ נְדִיבָה תִסְמְכֵנִי׃","latin":"Redde mihi laetitiam salutaris tui; et spiritu principali confirma me.","kjv":"Restore unto me the joy of thy salvation; and uphold me with thy free spirit.","esv":"Restore to me the joy of your salvation, and uphold me with a willing spirit.","rsv":"Restore to me the joy of thy salvation, and uphold me with a willing spirit."},{"verse":15,"hebrew":"אֲלַמְּדָה פֹשְׁעִים דְּרָכֶיךָ וְחַטָּאִים אֵלֶיךָ יָשׁוּבוּ׃","latin":"Docebo iniquos vias tuas; et impii ad te convertentur.","kjv":"Then will I teach transgressors thy ways; and sinners shall be converted unto thee.","esv":"Then I will teach transgressors your ways, and sinners will return to you.","rsv":"Then I will teach transgressors your ways, and sinners will return to thee."},{"verse":16,"hebrew":"הַצִּילֵנִי מִדָּמִים אֱלֹהִים אֱלֹהֵי תְּשׁוּעָתִי תְּרַנֵּן לְשׁוֹנִי צִדְקָתֶךָ׃","latin":"Libera me de sanguinibus, Deus, Deus salutis meae; et exsultabit lingua mea justitiam tuam.","kjv":"Deliver me from bloodguiltiness, O God, thou God of my salvation: and my tongue shall sing aloud of thy righteousness.","esv":"Deliver me from bloodguiltiness, O God, O God of my salvation, and my tongue will sing aloud of your righteousness.","rsv":"Deliver me from bloodguiltiness, O God, thou God of my salvation, and my tongue will sing aloud of thy deliverance."},{"verse":17,"hebrew":"אֲדֹנָי שְׂפָתַי תִּפְתָּח וּפִי יַגִּיד תְּהִלָּתֶךָ׃","latin":"Domine, labia mea aperies; et os meum annuntiabit laudem tuam.","kjv":"O Lord, open thou my lips; and my mouth shall shew forth thy praise.","esv":"O Lord, open my lips, and my mouth will declare your praise.","rsv":"O Lord, open thou my lips, and my mouth shall show forth thy praise."},{"verse":18,"hebrew":"כִּי לֹא תַחְפֹּץ זֶבַח וְאֶתֵּנָה עוֹלָה לֹא תִרְצֶה׃","latin":"Quoniam si voluisses sacrificium, dedissem utique; holocaustis non delectaberis.","kjv":"For thou desirest not sacrifice; else would I give it: thou delightest not in burnt offering.","esv":"For you will not delight in sacrifice, or I would give it; you will not be pleased with a burnt offering.","rsv":"For thou hast no delight in sacrifice; were I to give a burnt offering, thou wouldst not be pleased."},{"verse":19,"hebrew":"זִבְחֵי אֱלֹהִים רוּחַ נִשְׁבָּרָה לֵב נִשְׁבָּר וְנִדְכֶּה אֱלֹהִים לֹא תִבְזֶה׃","latin":"Sacrificium Deo spiritus contribulatus; cor contritum et humiliatum, Deus, non despicies.","kjv":"The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.","esv":"The sacrifices of God are a broken spirit; a broken and contrite heart, O God, you will not despise.","rsv":"The sacrifice acceptable to God is a broken spirit; a broken and contrite heart, O God, thou wilt not despise."},{"verse":20,"hebrew":"הֵיטִיבָה בִרְצוֹנְךָ אֶת צִיּוֹן תִּבְנֶה חוֹמוֹת יְרוּשָׁלָם׃","latin":"Benigne fac, Domine, in bona voluntate tua Sion, ut aedificentur muri Hierusalem.","kjv":"Do good in thy good pleasure unto Zion: build thou the walls of Jerusalem.","esv":"Do good to Zion in your good pleasure; build up the walls of Jerusalem;","rsv":"Do good to Zion in thy good pleasure; rebuild the walls of Jerusalem,"},{"verse":21,"hebrew":"אָז תַּחְפֹּץ זִבְחֵי צֶדֶק עוֹלָה וְכָלִיל אָז יַעֲלוּ עַל מִזְבַּחֲךָ פָרִים׃","latin":"Tunc acceptabis sacrificium justitiae, oblationes et holocausta; tunc imponent super altare tuum vitulos.","kjv":"Then shalt thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering: then shall they offer bullocks upon thine altar.","esv":"then you will delight in right sacrifices, in burnt offerings and whole burnt offerings; then bulls will be offered on your altar.","rsv":"then thou wilt delight in right sacrifices, in burnt offerings and whole burnt offerings; then bulls will be offered on thy altar."}]},{"psalm":91,"title":"Psalm 91","superscript":"He Who Dwells in the Shadow of the Almighty","verses":[{"verse":1,"hebrew":"יֹשֵׁב בְּסֵתֶר עֶלְיוֹן בְּצֵל שַׁדַּי יִתְלוֹנָן׃","latin":"Qui habitat in adjutorio Altissimi, in protectione Dei caeli commorabitur.","kjv":"He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.","esv":"He who dwells in the shelter of the Most High will abide in the shadow of the Almighty.","rsv":"He who dwells in the shelter of the Most High, who abides in the shadow of the Almighty,"},{"verse":2,"hebrew":"אֹמַר לַיהוָה מַחְסִי וּמְצוּדָתִי אֱלֹהַי אֶבְטַח בּוֹ׃","latin":"Dicet Domino: Susceptor meus es tu et refugium meum; Deus meus, sperabo in eum.","kjv":"I will say of the LORD, He is my refuge and my fortress: my God; in him will I trust.","esv":"I will say to the LORD, \"My refuge and my fortress, my God, in whom I trust.\"","rsv":"will say to the LORD, \"My refuge and my fortress; my God, in whom I trust.\""},{"verse":3,"hebrew":"כִּי הוּא יַצִּילְךָ מִפַּח יָקוּשׁ מִדֶּבֶר הַוּוֹת׃","latin":"Quoniam ipse liberavit me de laqueo venantium, et a verbo aspero.","kjv":"Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence.","esv":"For he will deliver you from the snare of the fowler and from the deadly pestilence.","rsv":"For he will deliver you from the snare of the fowler and from the deadly pestilence;"},{"verse":4,"hebrew":"בְּאֶבְרָתוֹ יָסֶךְ לָךְ וְתַחַת כְּנָפָיו תֶּחְסֶה צִנָּה וְסֹחֵרָה אֲמִתּוֹ׃","latin":"Scapulis suis obumbrabit tibi, et sub pennis ejus sperabis.","kjv":"He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.","esv":"He will cover you with his pinions, and under his wings // ─── STATE ────────────────────────────────────────────────────────────────────
let current = null;
let show = { he: true, la: true, kjv: true, esv: true, rsv: false };

// ─── BOOT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildOverlay();
  const hash = parseInt(location.hash.replace('#psalm-','')) || 1;
  renderPsalm(hash);
  document.getElementById('controls').style.display = '';
  window.addEventListener('scroll', () => {
    document.getElementById('back-top').classList.toggle('vis', window.scrollY > 400);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
});

// ─── RENDER PSALM ─────────────────────────────────────────────────────────────
function renderPsalm(num) {
  stopSpeaking();
  const psalm = PSALMS.find(p => p.psalm === num);
  current = psalm || null;

  // header
  const hdr = document.getElementById('psalm-header');
  if (!psalm) {
    hdr.innerHTML = '<p style="color:var(--ink-faint);font-style:italic">Psalm ' + num + ' not yet loaded. Run generate_data.py to download all 150.</p>';
  } else {
    const roman = toRoman(num);
    hdr.innerHTML =
      '<div class="psalm-number-display">Psalm ' + roman + ' &nbsp;&middot;&nbsp; ' + num + '</div>' +
      '<div class="psalm-title-display">' + esc(getPsalmName(num)) + '</div>' +
      (psalm.superscript ? '<div class="psalm-tagline">' + esc(psalm.superscript) + '</div>' : '');
  }

  // verses
  const vl = document.getElementById('verse-list');
  vl.innerHTML = '';
  if (psalm) psalm.verses.forEach(v => vl.appendChild(makeVerseBlock(v, num)));

  // overlay active cell
  document.querySelectorAll('.ps-cell').forEach(c => {
    c.classList.toggle('active', parseInt(c.dataset.n) === num);
  });

  // nav
  document.getElementById('nav-prev').disabled = num <= 1;
  document.getElementById('nav-next').disabled = num >= 150;

  history.pushState(null, '', '#psalm-' + num);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goPrev() { if (current) renderPsalm(Math.max(1, current.psalm - 1)); }
function goNext() { if (current) renderPsalm(Math.min(150, current.psalm + 1)); }

// ─── VERSE BLOCK ──────────────────────────────────────────────────────────────
function makeVerseBlock(v, psalmNum) {
  const block = document.createElement('div');
  block.className = 'verse-block';
  block.dataset.v = v.verse;

  block.innerHTML =
    '<div class="vbar">' +
      '<span class="vbar-num">Verse ' + v.verse + '</span>' +
      '<div class="vbar-actions">' +
        '<button class="vbar-btn" onclick="speakVerse(' + psalmNum + ',' + v.verse + ',\'he\')">&#x1F509; Heb</button>' +
        '<button class="vbar-btn" onclick="speakVerse(' + psalmNum + ',' + v.verse + ',\'la\')">&#x1F509; Lat</button>' +
      '</div>' +
    '</div>';

  if (v.hebrew)  block.appendChild(makeLangPanel('he',  'heb-panel', 'pip-heb', 'Hebrew (Masoretic)',     v.hebrew,  phoneticHeb(v.hebrew)));
  if (v.latin)   block.appendChild(makeLangPanel('la',  'lat-panel', 'pip-lat', 'Latin (Vulgate)',        v.latin,   phoneticLat(v.latin)));
  if (v.kjv)     block.appendChild(makeLangPanel('kjv', 'kjv-panel', 'pip-kjv', 'English &mdash; KJV',    v.kjv,     null));
  if (v.esv)     block.appendChild(makeLangPanel('esv', 'esv-panel', 'pip-esv', 'English &mdash; ESV',    v.esv,     null));
  if (v.rsv)     block.appendChild(makeLangPanel('rsv', 'rsv-panel', 'pip-rsv', 'English &mdash; RSV',    v.rsv,     null));

  // apply current visibility
  Object.keys(show).forEach(lang => {
    const p = block.querySelector('.' + lang + '-panel');
    if (p) p.classList.toggle('hidden', !show[lang]);
  });

  return block;
}

function makeLangPanel(lang, cls, pipCls, label, text, phonetic) {
  const p = document.createElement('div');
  p.className = 'lang-panel ' + cls + ' ' + lang + '-panel';
  p.innerHTML =
    '<div class="lang-label"><span class="lang-pip ' + pipCls + '"></span>' + label + '</div>' +
    '<div class="original-text">' + esc(text) + '</div>' +
    (phonetic ? '<div class="phonetic">' + fmtPhonetic(phonetic) + '</div>' : '');
  return p;
}

// ─── LANGUAGE TOGGLES ─────────────────────────────────────────────────────────
function toggleLang(lang) {
  show[lang] = !show[lang];
  document.querySelectorAll('.' + lang + '-panel').forEach(p => p.classList.toggle('hidden', !show[lang]));
  const btn = document.getElementById('btn-' + lang);
  if (btn) btn.classList.toggle('on', show[lang]);
}

// ─── PHONETICS ────────────────────────────────────────────────────────────────
function phoneticHeb(text) {
  if (!text) return '';
  const CONS = {'א':'','בּ':'b','ב':'v','ג':'g','ד':'d','ה':'h','ו':'v','ז':'z','ח':'kh','ט':'t','י':'y','כּ':'k','כ':'kh','ך':'kh','ל':'l','מ':'m','ם':'m','נ':'n','ן':'n','ס':'s','ע':'','פּ':'p','פ':'f','ף':'f','צ':'ts','ץ':'ts','ק':'k','ר':'r','שׁ':'sh','שׂ':'s','ש':'sh','תּ':'t','ת':'t'};
  const VOWELS = {'\u05B0':'e','\u05B1':'e','\u05B2':'a','\u05B3':'o','\u05B4':'i','\u05B5':'e','\u05B6':'e','\u05B7':'a','\u05B8':'a','\u05B9':'o','\u05BA':'o','\u05BB':'u'};
  const words = text.split(/\s+/).filter(Boolean);
  return words.map(word => {
    const norm = word.normalize('NFD');
    let ph = '';
    let i = 0;
    const chars = [...norm];
    while (i < chars.length) {
      const cp = chars[i].codePointAt(0);
      if (cp >= 0x05D0 && cp <= 0x05EA) {
        let vowel = '', j = i + 1;
        while (j < chars.length) {
          const ncp = chars[j].codePointAt(0);
          if (ncp >= 0x05B0 && ncp <= 0x05C7) {
            if (VOWELS[chars[j]]) vowel = VOWELS[chars[j]];
            j++;
          } else if (ncp >= 0x0591 && ncp <= 0x05AF) { j++; }
          else break;
        }
        const c2 = CONS[chars[i]]; 
        ph += (c2 !== undefined ? c2 : '') + vowel;
        i = j;
      } else if (cp >= 0x0591 && cp <= 0x05C7) { i++; }
      else { i++; }
    }
    if (!ph) return '';
    const syls = ph.match(/[^aeiou]*[aeiou]+(?:[^aeiou]*(?=[aeiou])|[^aeiou]*$)/gi) || [ph];
    const si = syls.length > 1 ? syls.length - 1 : 0;
    return syls.map((s,idx) => idx === si ? '\u02C8' + s : s).join('\u00B7');
  }).filter(Boolean).join('  ');
}

function phoneticLat(text) {
  if (!text) return '';
  const words = text.split(/\s+/).filter(Boolean);
  return words.map(w => {
    let ph = w.toLowerCase().replace(/[^a-z]/g,'');
    if (!ph) return '';
    ph = ph.replace(/ae|oe/g,'ay').replace(/qu/g,'kw').replace(/ch/g,'k').replace(/ph/g,'f').replace(/th/g,'t').replace(/gn/g,'ny').replace(/ti(?=[aeiou])/g,'tsi').replace(/c(?=[ei])/g,'ch').replace(/g(?=[ei])/g,'j').replace(/j/g,'y').replace(/x/g,'ks').replace(/y/g,'ee');
    const syls = ph.match(/[^aeiou]*[aeiou]+(?:[^aeiou]*(?=[aeiou])|[^aeiou]*$)/gi) || [ph];
    if (syls.length === 1) return '\u02C8' + syls[0];
    const si = syls.length >= 3 ? syls.length - 3 : syls.length - 2;
    return syls.map((s,i) => i === Math.max(0,si) ? '\u02C8' + s : s).join('\u00B7');
  }).filter(Boolean).join('  ');
}

function fmtPhonetic(ph) {
  return esc(ph)
    .replace(/\u02C8/g,'<span class="ph-stress">\u02C8</span>')
    .replace(/\u00B7/g,'<span class="ph-dot">\u00B7</span>');
}

// ─── AUDIO ────────────────────────────────────────────────────────────────────
let speaking = false;

function speakVerse(psalmNum, verseNum, lang) {
  const psalm = PSALMS.find(p => p.psalm === psalmNum);
  const verse = psalm && psalm.verses.find(v => v.verse === verseNum);
  if (!verse) return;
  const text = lang === 'he' ? verse.hebrew : verse.latin;
  if (!text) return;
  stopSpeaking();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang === 'he' ? 'he-IL' : 'it-IT';
  utt.rate = 0.78;
  const block = document.querySelector('.verse-block[data-v="' + verseNum + '"]');
  if (block) block.classList.add('speaking');
  utt.onend = () => { if (block) block.classList.remove('speaking'); speaking = false; };
  speaking = true;
  speechSynthesis.speak(utt);
}

function speakAll(lang) {
  if (!current) return;
  stopSpeaking();
  const verses = current.verses;
  let idx = 0;
  function next() {
    if (idx >= verses.length) { speaking = false; return; }
    const v = verses[idx++];
    const text = lang === 'he' ? v.hebrew : v.latin;
    if (!text) { next(); return; }
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = lang === 'he' ? 'he-IL' : 'it-IT';
    utt.rate = 0.78;
    document.querySelectorAll('.verse-block').forEach(b => b.classList.remove('speaking'));
    const block = document.querySelector('.verse-block[data-v="' + v.verse + '"]');
    if (block) { block.classList.add('speaking'); block.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    utt.onend = next;
    speechSynthesis.speak(utt);
  }
  speaking = true;
  next();
}

function stopSpeaking() {
  speechSynthesis.cancel();
  speaking = false;
  document.querySelectorAll('.verse-block').forEach(b => b.classList.remove('speaking'));
}
